name: nexuscart

services:
  user-service:
    build:
      context: ../user-service
    environment:
      PORT: "8081"
      GIN_MODE: release
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  catalog-service:
    build:
      context: ../catalog-service
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8082"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  order-service:
    build:
      context: ../order-service
    environment:
      PORT: "8083"
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8082}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8083"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    networks:
      - shop-network

  frontend:
    build:
      context: ../frontend
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  api-gateway:
    build:
      context: ../api-gateway
    environment:
      PORT: "8080"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:80}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8082}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8083}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/gateway-health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge
