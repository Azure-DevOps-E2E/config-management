replicaCount: 1

image:
  repository: example.azurecr.io/catalog-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

appVersion: "1.0.0"
nameOverride: ""
fullnameOverride: ""

containerPort: 8000

service:
  type: ClusterIP
  port: 8000

health:
  path: /health
  readinessInitialDelaySeconds: 3
  livenessInitialDelaySeconds: 10

env: []

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
