replicaCount: 1

image:
  repository: example.azurecr.io/user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

appVersion: "1.0.0"
nameOverride: ""
fullnameOverride: ""

containerPort: 8081

service:
  type: ClusterIP
  port: 8081

health:
  path: /health
  readinessInitialDelaySeconds: 3
  livenessInitialDelaySeconds: 10

env:
  - name: PORT
    value: "8081"
  - name: GIN_MODE
    value: "release"

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
