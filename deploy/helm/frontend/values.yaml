replicaCount: 1

image:
  repository: example.azurecr.io/frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

appVersion: "1.0.0"
nameOverride: ""
fullnameOverride: ""

containerPort: 80

service:
  type: ClusterIP
  port: 80

health:
  path: /health
  readinessInitialDelaySeconds: 3
  livenessInitialDelaySeconds: 10

# env: []
env:
  - name: NGINX_ENVSUBST_FILTER
    value: '^(APP_VERSION|APP_IMAGE_TAG)$'

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
