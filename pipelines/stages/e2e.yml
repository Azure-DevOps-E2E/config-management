stages:
  - stage: E2E
    displayName: Full-stack Docker Compose E2E
    jobs:
      - job: ComposeSmoke
        displayName: Build, start and smoke test all services
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            path: s/devops
          - checkout: frontend
            clean: true
            path: s/frontend
          - checkout: userService
            clean: true
            path: s/user-service
          - checkout: catalogService
            clean: true
            path: s/catalog-service
          - checkout: orderService
            clean: true
            path: s/order-service
          - checkout: apiGateway
            clean: true
            path: s/api-gateway

          - bash: docker compose config --quiet
            displayName: Validate Compose configuration
            workingDirectory: $(Pipeline.Workspace)/s/devops

          - bash: docker compose build
            displayName: Build all application images
            workingDirectory: $(Pipeline.Workspace)/s/devops

          - bash: docker compose up --detach --wait --wait-timeout 240
            displayName: Start and wait for the full stack
            workingDirectory: $(Pipeline.Workspace)/s/devops

          - task: PowerShell@2
            displayName: Check component health and versions
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/health.ps1
              arguments: -BaseUrl "http://localhost:8080"

          - task: PowerShell@2
            displayName: Create and verify an order through the gateway
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/smoke.ps1
              arguments: -BaseUrl "http://localhost:8080"

          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/compose"
              docker compose ps --all > "$(Build.ArtifactStagingDirectory)/compose/ps.txt" || true
              docker compose logs --no-color > "$(Build.ArtifactStagingDirectory)/compose/logs.txt" 2>&1 || true
            displayName: Capture Compose diagnostics
            condition: failed()
            workingDirectory: $(Pipeline.Workspace)/s/devops

          - task: PublishPipelineArtifact@1
            displayName: Publish failed Compose diagnostics
            condition: failed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/compose
              artifact: compose-diagnostics
              publishLocation: pipeline

          - bash: docker compose down --remove-orphans
            displayName: Stop and remove the test stack
            condition: always()
            workingDirectory: $(Pipeline.Workspace)/s/devops
