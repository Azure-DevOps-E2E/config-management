parameters:
- name: linter
  type: string
- name: projectDir
  type: string
  default: '$(Build.SourcesDirectory)'
- name: resultsDir
  type: string
  default: '$(Agent.TempDirectory)/qodana/results'
- name: cacheDir
  type: string
  default: '$(Agent.TempDirectory)/qodana/cache'
- name: maxMemory
  type: string
  default: '512m'
- name: requiresToken
  type: boolean
  default: false
- name: condition
  type: string
  default: 'succeeded()'

steps:
- task: Cache@2
  displayName: 'Restore Qodana cache'
  condition: ${{ parameters.condition }}
  inputs:
    key: '"qodana" | "$(Agent.OS)" | "${{ parameters.linter }}" | "$(Build.Repository.Name)"'
    restoreKeys: |
      "qodana" | "$(Agent.OS)" | "${{ parameters.linter }}"
      "qodana" | "$(Agent.OS)"
    path: ${{ parameters.cacheDir }}

- bash: |
    set -euo pipefail
    
    echo "##[section]STEP 1: Executing Qodana Static Analysis Scan..."
    
    RESULTS_DIR="${{ parameters.resultsDir }}"
    CACHE_DIR="${{ parameters.cacheDir }}"
    MAX_MEM="${{ parameters.maxMemory }}"
    mkdir -p "$RESULTS_DIR" "$CACHE_DIR"

    echo "Using Linter: ${{ parameters.linter }}"
    echo "Scanning Directory: ${{ parameters.projectDir }}"
    echo "JVM Max Memory Limit: $MAX_MEM"
    
    set +e
    docker run --rm \
      --volume "${{ parameters.projectDir }}:/data/project" \
      --volume "$RESULTS_DIR:/data/results" \
      --volume "$CACHE_DIR:/data/cache" \
      --env QODANA_TOKEN="$(QODANA_TOKEN)" \
      --env QODANA_JVM_ARGS="-Xms128m -Xmx$MAX_MEM -XX:MaxRAMPercentage=35.0 -XX:+UseG1GC -XX:ReservedCodeCacheSize=96m" \
      ${{ parameters.linter }} \
      --save-report
    
    STATUS=$?
    set -e

    if [ $STATUS -eq 137 ]; then
      echo "##vso[task.logissue type=error]Qodana container exited with code 137 (Out Of Memory). Try tuning maxMemory parameter or increasing build agent RAM."
      exit 137
    elif [ $STATUS -ne 0 ]; then
      echo "##vso[task.logissue type=error]Qodana scan exited with code $STATUS"
      exit $STATUS
    fi

    echo "##[section]Qodana Scan completed successfully. Report generated at $RESULTS_DIR"
  displayName: 'Qodana Step 1: Run Static Analysis & Collect Report'
  name: qodanaScan
  condition: ${{ parameters.condition }}

- task: PublishBuildArtifacts@1
  displayName: 'Publish Qodana Report Artifact'
  condition: and(always(), ${{ parameters.condition }}, exists('${{ parameters.resultsDir }}'))
  inputs:
    PathtoPublish: '${{ parameters.resultsDir }}'
    ArtifactName: 'qodana-report'
    publishLocation: 'Container'
