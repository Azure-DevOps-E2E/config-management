parameters:
- name: resultsDir
  type: string
  default: '$(Agent.TempDirectory)/qodana/results'
- name: failThreshold
  type: number
  default: 0
  description: 'Maximum allowed total problems before Quality Gate fails'
- name: failOnCritical
  type: boolean
  default: true
  description: 'Fail Quality Gate immediately if any CRITICAL severity issue is found'
- name: condition
  type: string
  default: 'succeeded()'

steps:
- bash: |
    set -euo pipefail

    echo "##[section]STEP 2: Evaluating Qodana Quality Gate..."

    RESULTS_DIR="${{ parameters.resultsDir }}"
    SARIF_FILE="$RESULTS_DIR/qodana.sarif.json"

    if [ ! -f "$SARIF_FILE" ]; then
      echo "##[warning]Qodana SARIF report file not found at $SARIF_FILE. Quality Gate cannot evaluate."
      exit 0
    fi

    # Parse SARIF JSON using python/jq to count issues by severity
    CRITICAL_COUNT=$(python3 -c "
import json
try:
    with open('$SARIF_FILE') as f:
        data = json.load(f)
    runs = data.get('runs', [])
    results = runs[0].get('results', []) if runs else []
    criticals = [r for r in results if r.get('level') == 'error' or r.get('properties', {}).get('severity') == 'CRITICAL']
    print(len(criticals))
except Exception as e:
    print(0)
" 2>/dev/null || echo 0)

    TOTAL_ISSUES=$(python3 -c "
import json
try:
    with open('$SARIF_FILE') as f:
        data = json.load(f)
    runs = data.get('runs', [])
    results = runs[0].get('results', []) if runs else []
    print(len(results))
except Exception as e:
    print(0)
" 2>/dev/null || echo 0)

    echo "##[section]Qodana Analysis Summary:"
    echo "  - Total Problems Found: $TOTAL_ISSUES"
    echo "  - Critical Problems Found: $CRITICAL_COUNT"
    echo "  - Configured Fail Threshold (Max Problems): ${{ parameters.failThreshold }}"
    echo "  - Fail On Critical: ${{ parameters.failOnCritical }}"

    GATE_FAILED=false

    if [ "${{ parameters.failOnCritical }}" = true ] && [ "$CRITICAL_COUNT" -gt 0 ]; then
      echo "##vso[task.logissue type=error]QUALITY GATE FAILED: Found $CRITICAL_COUNT Critical Severity issue(s)!"
      GATE_FAILED=true
    fi

    if [ "$TOTAL_ISSUES" -gt "${{ parameters.failThreshold }}" ]; then
      echo "##vso[task.logissue type=error]QUALITY GATE FAILED: Total issues ($TOTAL_ISSUES) exceeds allowed threshold (${{ parameters.failThreshold }})!"
      GATE_FAILED=true
    fi

    if [ "$GATE_FAILED" = true ]; then
      echo "##[error]❌ QODANA QUALITY GATE STATUS: REJECTED (FAIL)"
      exit 1
    fi

    echo "##[section]✅ QODANA QUALITY GATE STATUS: PASSED"
  displayName: 'Qodana Step 2: Evaluate Quality Gate (Pass / Fail Decision)'
  condition: ${{ parameters.condition }}
