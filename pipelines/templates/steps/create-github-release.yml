parameters:
- name: releaseTag
  type: string
  default: '$(releaseTag)'
- name: serviceName
  type: string
  default: '$(serviceName)'
- name: imageRepository
  type: string
  default: '$(imageRepository)'
- name: acrLoginServer
  type: string
  default: '$(acrLoginServer)'
- name: promotedImageDigest
  type: string
  default: '$(promotedImageDigest)'
- name: candidateSourceVersion
  type: string
  default: '$(candidateSourceVersion)'
- name: buildSourceVersion
  type: string
  default: '$(Build.SourceVersion)'
- name: buildRepositoryName
  type: string
  default: '$(Build.Repository.Name)'

steps:
- bash: |
    set -euo pipefail

    TAG="${{ parameters.releaseTag }}"
    repo_slug="${{ parameters.buildRepositoryName }}"

    if [[ -z "$repo_slug" || "$repo_slug" == '$(Build.Repository.Name)' ]]; then
      remote_url="$(git remote get-url origin 2>/dev/null || true)"
      if [[ -z "$remote_url" ]]; then
        echo '##vso[task.logissue type=error]Unable to resolve GitHub repository slug from origin remote'
        exit 1
      fi

      if [[ "$remote_url" =~ github\.com[:/]+([^/]+)/([^/]+?)(\.git)?$ ]]; then
        repo_slug="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
      else
        echo "##vso[task.logissue type=error]Origin remote '$remote_url' is not a recognized GitHub repository URL"
        exit 1
      fi
    fi

    if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
      echo "##vso[task.logissue type=error]Release tag '$TAG' does not exist on origin."
      exit 1
    fi

    echo "##[section]Using GitHub repository slug '$repo_slug' for release creation."

    echo "##[section]Resolving GitHub checkout credentials from git config."
    auth_header="$(git config --get http.https://github.com/.extraheader 2>/dev/null || true)"
    if [[ -z "$auth_header" ]]; then
      auth_header="$(git config --get http.https://github.com.extraheader 2>/dev/null || true)"
    fi
    if [[ -z "$auth_header" ]]; then
      auth_header="$(
        {
          git config --get-regexp '^http\..*\.extraheader$' 2>/dev/null || true
        } | awk 'BEGIN { IGNORECASE = 1 } /github\.com/ && /AUTHORIZATION:/ {
          sub(/^.*AUTHORIZATION: /, "")
          print
          exit
        }'
      )"
    fi
    if [[ -z "$auth_header" ]]; then
      echo '##vso[task.logissue type=error]Unable to find persisted GitHub checkout credentials for release creation'
      echo '##[debug]Available http.extraheader entries:'
      git config --get-regexp '^http\..*\.extraheader$' 2>/dev/null || true
      exit 1
    fi

    check_release_exists() {
      curl -sS -o release-lookup.json -w '%{http_code}' \
        -H "Authorization: $auth_header" \
        -H 'Accept: application/vnd.github+json' \
        -H 'X-GitHub-Api-Version: 2022-11-28' \
        "https://api.github.com/repos/$repo_slug/releases/tags/$TAG"
    }

    lookup_status="$(check_release_exists)"
    if [[ "$lookup_status" == '200' ]]; then
      echo "##[warning]GitHub Release $TAG already exists. Skipping creation."
      exit 0
    elif [[ "$lookup_status" != '404' ]]; then
      echo "##vso[task.logissue type=error]Failed to check whether GitHub Release $TAG already exists. HTTP $lookup_status"
      cat release-lookup.json
      exit 1
    fi

    cat > release-payload.json <<EOF
    {
      "tag_name": "$TAG",
      "target_commitish": "${{ parameters.buildSourceVersion }}",
      "name": "${{ parameters.serviceName }} $TAG",
      "body": "Production manifest update completed successfully.\n\n- Image: ${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:$TAG\n- Digest: ${{ parameters.promotedImageDigest }}\n- DEV candidate commit: ${{ parameters.candidateSourceVersion }}\n- PROD commit: ${{ parameters.buildSourceVersion }}\n- Manifest: config-management/deploy/helm/${{ parameters.serviceName }}/values-prod.yaml",
      "draft": false,
      "prerelease": false,
      "make_latest": "true"
    }
    EOF

    status="`curl -sS -o release-response.json -w '%{http_code}' \
      -X POST \
      -H "Authorization: $auth_header" \
      -H 'Accept: application/vnd.github+json' \
      -H 'X-GitHub-Api-Version: 2022-11-28' \
      "https://api.github.com/repos/$repo_slug/releases" \
      --data-binary @release-payload.json`"

    if [[ "$status" == '201' ]]; then
      echo "Created GitHub Release $TAG"
    elif [[ "$status" == '422' ]]; then
      lookup_status="$(check_release_exists)"
      if [[ "$lookup_status" == '200' ]]; then
        echo "##[warning]GitHub Release $TAG already exists. Skipping creation."
      else
        echo "##vso[task.logissue type=error]GitHub Release creation failed with HTTP 422"
        cat release-response.json
        exit 1
      fi
    else
      echo "##vso[task.logissue type=error]GitHub Release creation failed with HTTP $status"
      cat release-response.json
      exit 1
    fi
  displayName: 'Create GitHub Release'
