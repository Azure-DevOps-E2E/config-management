parameters:
- name: runtime
  type: string
  values: ['go', 'node', 'python', 'java']
- name: condition
  type: string
  default: 'succeeded()'

steps:
- bash: |
    set -euo pipefail

    echo "##[section]Executing Lightweight Dependency & Secret Security Scan for runtime: ${{ parameters.runtime }}..."

    # 1. Fast Secret & Misconfiguration Scanning
    if command -v trivy >/dev/null 2>&1; then
      echo "##[command]trivy fs --scanners secret,vuln --severity CRITICAL ."
      trivy fs --scanners secret,vuln --severity CRITICAL . || {
        echo "##vso[task.logissue type=warning]Security issues or secrets detected in codebase."
      }
    else
      echo "Running containerized Trivy scanner..."
      docker run --rm \
        --memory="1g" \
        -v "$(Build.SourcesDirectory):/src" \
        aquasec/trivy:0.72.0 fs --scanners secret,vuln --severity CRITICAL /src || {
          echo "##vso[task.logissue type=warning]Security issues or secrets detected in codebase."
        }
    fi

    # 2. Runtime-specific lightweight audit (non-compiling, low memory)
    case "${{ parameters.runtime }}" in
      go)
        echo "Go dependency check completed via Trivy."
        ;;
      node)
        if command -v npm >/dev/null 2>&1; then
          echo "Running Npm Audit..."
          npm audit --audit-level=high --omit=dev || true
        fi
        ;;
      python)
        if command -v python >/dev/null 2>&1; then
          if ! command -v pip-audit >/dev/null 2>&1; then
            echo "pip-audit not found; attempting installation..."
            python -m pip install --disable-pip-version-check --no-input pip-audit >/dev/null 2>&1 || true
          fi

          if command -v pip-audit >/dev/null 2>&1; then
            echo "Running pip-audit..."
            pip-audit || true
          else
            echo "##vso[task.logissue type=warning]pip-audit is unavailable; skipping Python dependency audit."
          fi
        fi
        ;;
      java)
        echo "Java dependency check completed via Trivy."
        ;;
    esac

    echo "##[section]Security Scan completed successfully."
  displayName: 'Security Scan (Dependencies & Secret Leak Check)'
  condition: ${{ parameters.condition }}
