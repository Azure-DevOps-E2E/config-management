parameters:
- name: cacheKey
  type: string
  default: node24
- name: testResultsFile
  type: string
  default: reports/test-results.xml
- name: coverageDirectory
  type: string
  default: coverage
- name: coverageFile
  type: string
  default: coverage/lcov.info
- name: validationCommand
  type: string
  default: ''
- name: buildCommand
  type: string
  default: ''
- name: condition
  type: string
  default: 'succeeded()'

steps:
- template: ../container/run-build-command.yml
  parameters:
    displayName: 'Validate, test, and build Node.js application in Docker'
    cacheKey: ${{ parameters.cacheKey }}
    condition: ${{ parameters.condition }}
    command: |
      echo '##[section]Node.js and npm versions'
      node --version
      npm --version
      mkdir -p '${{ parameters.coverageDirectory }}' reports
      echo '##[section]Install Node.js dependencies'
      echo '##[command]npm ci'
      npm ci
      echo '##[section]Vitest and coverage'
      npm run test:run -- \
        --reporter=default \
        --reporter=junit \
        --outputFile.junit='${{ parameters.testResultsFile }}' \
        --coverage \
        --coverage.reporter=text \
        --coverage.reporter=cobertura \
        --coverage.reportsDirectory='${{ parameters.coverageDirectory }}'
      if [ -n '${{ parameters.validationCommand }}' ]; then
        echo '##[section]Node.js validation'
        echo "##[command]${{ parameters.validationCommand }}"
        eval "${{ parameters.validationCommand }}"
      fi
      if [ -n '${{ parameters.buildCommand }}' ]; then
        echo '##[section]Node.js build'
        echo "##[command]${{ parameters.buildCommand }}"
        eval "${{ parameters.buildCommand }}"
      fi