parameters:
- name: cacheKey
  type: string
  default: node24
- name: testResultsFile
  type: string
  default: reports/test-results.xml
- name: coverageDirectory
  type: string
  default: coverage
- name: coverageFile
  type: string
  default: coverage/lcov.info
- name: condition
  type: string
  default: 'succeeded()'

steps:
- template: ../container/run-build-command.yml
  parameters:
    displayName: 'Lint and test Node.js application in Docker'
    cacheKey: ${{ parameters.cacheKey }}
    condition: ${{ parameters.condition }}
    command: |
      echo '##[section]Node.js and npm versions'
      node --version
      npm --version
      mkdir -p '${{ parameters.coverageDirectory }}' reports
      echo '##[section]Install Node.js dependencies'
      echo '##[command]npm ci'
      npm ci
      echo '##[section]Vitest and coverage'
      npm run test:run -- \
        --reporter=default \
        --reporter=junit \
        --outputFile.junit='${{ parameters.testResultsFile }}' \
        --coverage \
        --coverage.reporter=text \
        --coverage.reporter=cobertura \
        --coverage.reportsDirectory='${{ parameters.coverageDirectory }}'
      echo '##[section]TypeScript validation'
      echo '##[command]npm run typecheck'
      npm run typecheck
