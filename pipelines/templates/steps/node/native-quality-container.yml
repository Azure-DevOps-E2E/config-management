parameters:
- name: cacheKey
  type: string
  default: node24
- name: testResultsFile
  type: string
  default: reports/test-results.xml
- name: coverageFile
  type: string
  default: coverage/lcov.info

steps:
- template: ../container/run-build-command.yml
  parameters:
    displayName: 'Check and test Node.js application in Docker'
    cacheKey: ${{ parameters.cacheKey }}
    command: |
      echo '##[section]Node.js and npm versions'
      node --version
      npm --version
      mkdir -p reports coverage
      echo '##[section]Install Node.js dependencies'
      echo '##[command]npm ci'
      npm ci
      echo '##[section]Node.js tests and coverage'
      node --test \
        --experimental-test-coverage \
        --test-reporter=spec \
        --test-reporter=junit \
        --test-reporter=lcov \
        --test-reporter-destination=stdout \
        --test-reporter-destination='${{ parameters.testResultsFile }}' \
        --test-reporter-destination='${{ parameters.coverageFile }}'
      echo '##[section]Node.js syntax validation'
      echo '##[command]npm run check'
      npm run check
