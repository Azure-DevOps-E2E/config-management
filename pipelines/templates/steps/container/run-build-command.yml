parameters:
- name: displayName
  type: string
- name: command
  type: string
- name: cacheKey
  type: string
- name: workingDirectory
  type: string
  default: /workspace

steps:
- bash: |
    set -euo pipefail

    image='$(resolvedBuildImage)'
    if [ -z "$image" ]; then
      echo '##vso[task.logissue type=error]resolvedBuildImage is empty'
      exit 1
    fi

    ci_home="$(Pipeline.Workspace)/.ci-container-home/${{ parameters.cacheKey }}"
    mkdir -p "$ci_home"

    echo "##[section]Start foreground CI container: $image"
    echo "##[command]docker run --rm --workdir '${{ parameters.workingDirectory }}' $image"

    set +e
    docker run --rm \
      --user "${UID}:${GROUPS[0]}" \
      --env CI=true \
      --env HOME=/tmp/ci-home \
      --volume "$(Build.SourcesDirectory):/workspace" \
      --volume "$ci_home:/tmp/ci-home" \
      --workdir '${{ parameters.workingDirectory }}' \
      --entrypoint /bin/sh \
      "$image" \
      -ec "$BUILD_COMMAND"
    container_status=$?
    set -e

    if [ "$container_status" -ne 0 ]; then
      echo "##vso[task.logissue type=error]CI container $image exited with code $container_status"
      exit "$container_status"
    fi

    echo "##[section]CI container completed successfully: $image"
  displayName: ${{ parameters.displayName }}
  env:
    BUILD_COMMAND: ${{ parameters.command }}
