parameters:
- name: scanImage
  type: string
- name: trivyVersion
  type: string
  default: '0.72.0'
- name: cacheDirectory
  type: string
  default: '$(Pipeline.Workspace)/.trivy-cache'
- name: severity
  type: string
  default: HIGH,CRITICAL

steps:
- bash: |
    set -euo pipefail
    TRIVY_BIN_DIR="$(Pipeline.Workspace)/.trivy-bin"
    TRIVY_VERSION='${{ parameters.trivyVersion }}'
    TRIVY_OS="$(uname -s)"
    TRIVY_ARCH="$(uname -m)"

    case "$TRIVY_OS" in
      Linux|Darwin) ;;
      *)
        echo "Unsupported operating system: $TRIVY_OS" >&2
        exit 1
        ;;
    esac

    case "$TRIVY_ARCH" in
      x86_64|amd64)
        TRIVY_ARCH='64bit'
        ;;
      aarch64|arm64)
        TRIVY_ARCH='ARM64'
        ;;
      *)
        echo "Unsupported architecture: $TRIVY_ARCH" >&2
        exit 1
        ;;
    esac

    mkdir -p "$TRIVY_BIN_DIR" '${{ parameters.cacheDirectory }}'

    if [ ! -x "$TRIVY_BIN_DIR/trivy" ]; then
      curl -fsSL \
        -o "$AGENT_TEMPDIRECTORY/trivy.tar.gz" \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_OS}-${TRIVY_ARCH}.tar.gz"
      tar -xzf "$AGENT_TEMPDIRECTORY/trivy.tar.gz" -C "$TRIVY_BIN_DIR"
      chmod +x "$TRIVY_BIN_DIR/trivy"
    fi

    export PATH="$TRIVY_BIN_DIR:$PATH"

    trivy image \
      --cache-dir '${{ parameters.cacheDirectory }}' \
      --exit-code 1 \
      --ignore-unfixed \
      --severity '${{ parameters.severity }}' \
      "$SCAN_IMAGE"
  displayName: 'Scan Docker image with Trivy CLI'
  env:
    SCAN_IMAGE: '${{ parameters.scanImage }}'