parameters:
- name: releaseTag
  type: string
  default: '$(releaseTag)'
- name: autoCreate
  type: boolean
  default: true

steps:
- bash: |
    set -euo pipefail

    TAG="${{ parameters.releaseTag }}"
    RAW_AUTO_CREATE="${{ parameters.autoCreate }}"
    AUTO_CREATE=$(echo "$RAW_AUTO_CREATE" | tr '[:upper:]' '[:lower:]')

    if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      echo "##vso[task.logissue type=error]Release tag '$TAG' must match format v<major>.<minor>.<patch> (e.g., v1.0.119)"
      exit 1
    fi

    echo "##[section]Validating Git release tag '$TAG' on remote origin..."

    if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
      echo "##[section]Using existing Git tag '$TAG' for release."
      exit 0
    fi

    if [[ "$AUTO_CREATE" != "true" && "$AUTO_CREATE" != "1" ]]; then
      echo "##vso[task.logissue type=error]Release tag '$TAG' does not exist on origin."
      echo "Please create the Git tag first, then rerun the release workflow."
      exit 1
    fi

    release_commit="$(git rev-parse HEAD)"
    echo "##[warning]Release tag '$TAG' does not exist on origin. Creating it at commit $release_commit..."
    git tag -f "$TAG" "$release_commit"
    git push origin "refs/tags/$TAG"
    echo "##[section]Created and pushed Git tag '$TAG' on origin."
  displayName: 'Validate and resolve release Git tag'