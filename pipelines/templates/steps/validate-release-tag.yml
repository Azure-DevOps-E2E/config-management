parameters:
- name: releaseTag
  type: string
  default: '$(releaseTag)'
- name: autoCreate
  type: boolean
  default: true

steps:
- bash: |
    set -euo pipefail

    TAG="${{ parameters.releaseTag }}"
    
    if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      echo "##vso[task.logissue type=error]Release tag '$TAG' must match format v<major>.<minor>.<patch> (e.g., v1.0.119)"
      exit 1
    fi

    echo "##[section]Validating Git release tag '$TAG'..."

    if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
      if [ "${{ parameters.autoCreate }}" = true ]; then
        echo "##[section]Release tag '$TAG' does not exist on origin. Auto-creating Git tag..."
        git config user.name 'azure-pipelines[bot]'
        git config user.email 'azure-pipelines@users.noreply.github.com'
        git tag "$TAG"
        git push origin "$TAG"
        echo "##[section]Successfully created and pushed Git tag '$TAG' to origin."
      else
        echo "##vso[task.logissue type=error]Release tag '$TAG' does not exist on origin."
        echo "Please create the Git tag first or enable auto-creation."
        exit 1
      fi
    else
      echo "##[section]Using existing Git tag '$TAG' for promotion."
    fi
  displayName: 'Validate and resolve release Git tag'
