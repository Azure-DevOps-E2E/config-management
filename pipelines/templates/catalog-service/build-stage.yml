stages:
- stage: Build
  displayName: 'Build Docker Image'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: 'Build Docker Image'
    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - script: |
        docker build \
          -f $(dockerfilePath) \
          -t $(imageName):$(Build.BuildId) \
          -t $(imageName):latest \
          .
      displayName: 'Build Docker image'
