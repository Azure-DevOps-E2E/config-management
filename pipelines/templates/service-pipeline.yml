parameters:
  - name: serviceName
    type: string
  - name: imageRepository
    type: string
  - name: testCommand
    type: string
  - name: dockerfilePath
    type: string
    default: Dockerfile

variables:
  - group: nexuscart-shared
  - name: vmImage
    value: ubuntu-latest
  - name: imageTag
    value: $(Build.BuildId)
  - name: fullImageName
    value: $(acrLoginServer)/${{ parameters.imageRepository }}:$(imageTag)

stages:
  - stage: CI
    displayName: CI - Test, build and scan
    jobs:
      - job: Test
        displayName: Test ${{ parameters.serviceName }}
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true
          - bash: |
              set -euo pipefail
              ${{ parameters.testCommand }}
            displayName: Run service tests

      - job: BuildAndScan
        displayName: Docker build and Trivy scan
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true
          - bash: |
              set -euo pipefail
              docker build \
                --file "$(Build.SourcesDirectory)/${{ parameters.dockerfilePath }}" \
                --tag "$(fullImageName)" \
                "$(Build.SourcesDirectory)"
            displayName: Build Docker image
          - bash: |
              set -euo pipefail
              mkdir -p "$(Pipeline.Workspace)/.trivy-cache"
              docker run --rm \
                --volume /var/run/docker.sock:/var/run/docker.sock \
                --volume "$(Pipeline.Workspace)/.trivy-cache:/root/.cache/" \
                aquasec/trivy:0.72.0 \
                image \
                --exit-code 1 \
                --ignore-unfixed \
                --severity HIGH,CRITICAL \
                "$(fullImageName)"
            displayName: Scan image with Trivy
          - bash: |
              set -euo pipefail
              docker save "$(fullImageName)" | gzip > "$(Build.ArtifactStagingDirectory)/container-image.tar.gz"
            displayName: Package image for publish stage
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          - task: PublishPipelineArtifact@1
            displayName: Publish container image artifact
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/container-image.tar.gz
              artifact: container-image
              publishLocation: pipeline

  - stage: Push_ACR
    displayName: Push image to ACR
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: Push immutable image tag
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: none
          - download: current
            artifact: container-image
          - bash: |
              set -euo pipefail
              gzip --decompress --stdout "$(Pipeline.Workspace)/container-image/container-image.tar.gz" | docker load
            displayName: Load tested image
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrServiceConnection)
          - bash: |
              set -euo pipefail
              docker push "$(fullImageName)"
            displayName: Push $(fullImageName)
          - task: Docker@2
            displayName: Logout from ACR
            condition: always()
            inputs:
              command: logout
              containerRegistry: $(acrServiceConnection)

  - stage: Deploy_DEV
    displayName: Deploy DEV
    dependsOn: Push_ACR
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        displayName: Helm deploy ${{ parameters.serviceName }} to DEV
        pool:
          vmImage: $(vmImage)
        environment: nexuscart-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: devops
                  clean: true
                  path: s/devops
                - task: HelmDeploy@1
                  displayName: Helm upgrade DEV
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: $(azureServiceConnection)
                    azureResourceGroup: $(aksResourceGroup)
                    kubernetesCluster: $(aksClusterName)
                    namespace: dev
                    command: upgrade
                    chartType: FilePath
                    chartPath: $(Pipeline.Workspace)/s/devops/deploy/helm/${{ parameters.serviceName }}
                    releaseName: ${{ parameters.serviceName }}
                    valueFile: $(Pipeline.Workspace)/s/devops/deploy/helm/${{ parameters.serviceName }}/values-dev.yaml
                    overrideValues: image.repository=$(acrLoginServer)/${{ parameters.imageRepository }},image.tag=$(imageTag),appVersion=$(imageTag)
                    install: true
                    waitForExecution: true
                    arguments: --atomic --create-namespace --timeout 5m

  - stage: Verify_DEV
    displayName: Smoke and health DEV
    dependsOn: Deploy_DEV
    condition: succeeded()
    jobs:
      - job: VerifyDev
        displayName: Verify integrated DEV environment
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: devops
            clean: true
            path: s/devops
          - task: PowerShell@2
            displayName: Wait for DEV health
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/wait-health.ps1
              arguments: -BaseUrl "$(devBaseUrl)" -TimeoutSeconds 300
          - task: PowerShell@2
            displayName: Check DEV components and deployed version
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/health.ps1
              arguments: >-
                -BaseUrl "$(devBaseUrl)"
                -ExpectedService "${{ parameters.serviceName }}"
                -ExpectedVersion "$(imageTag)"
          - task: PowerShell@2
            displayName: Run DEV smoke test
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/smoke.ps1
              arguments: -BaseUrl "$(devBaseUrl)"

  - stage: Approval
    displayName: Approve PROD
    dependsOn: Verify_DEV
    condition: succeeded()
    jobs:
      - job: WaitForApproval
        displayName: Manual production approval
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: |
                $(prodApprovers)
              instructions: Review DEV health, smoke results and image tag $(imageTag) before approving PROD.
              onTimeout: reject

  - stage: Deploy_PROD
    displayName: Deploy PROD
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        displayName: Helm deploy ${{ parameters.serviceName }} to PROD
        pool:
          vmImage: $(vmImage)
        environment: nexuscart-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: devops
                  clean: true
                  path: s/devops
                - task: HelmDeploy@1
                  displayName: Helm upgrade PROD
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: $(azureServiceConnection)
                    azureResourceGroup: $(aksResourceGroup)
                    kubernetesCluster: $(aksClusterName)
                    namespace: prod
                    command: upgrade
                    chartType: FilePath
                    chartPath: $(Pipeline.Workspace)/s/devops/deploy/helm/${{ parameters.serviceName }}
                    releaseName: ${{ parameters.serviceName }}
                    valueFile: $(Pipeline.Workspace)/s/devops/deploy/helm/${{ parameters.serviceName }}/values-prod.yaml
                    overrideValues: image.repository=$(acrLoginServer)/${{ parameters.imageRepository }},image.tag=$(imageTag),appVersion=$(imageTag)
                    install: true
                    waitForExecution: true
                    arguments: --atomic --create-namespace --timeout 5m

  - stage: Verify_PROD
    displayName: Health PROD
    dependsOn: Deploy_PROD
    condition: succeeded()
    jobs:
      - job: VerifyProd
        displayName: Verify production health
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: devops
            clean: true
            path: s/devops
          - task: PowerShell@2
            displayName: Wait for PROD health
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/wait-health.ps1
              arguments: -BaseUrl "$(prodBaseUrl)" -TimeoutSeconds 300
          - task: PowerShell@2
            displayName: Check PROD components and deployed version
            inputs:
              pwsh: true
              targetType: filePath
              filePath: $(Pipeline.Workspace)/s/devops/scripts/health.ps1
              arguments: >-
                -BaseUrl "$(prodBaseUrl)"
                -ExpectedService "${{ parameters.serviceName }}"
                -ExpectedVersion "$(imageTag)"
